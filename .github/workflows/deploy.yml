name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Atualiza o snapshot da Anatel uma vez por dia (09:30 UTC ~ 06:30 BRT).
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: write # para versionar o snapshot/novidades atualizados
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Busca os dados reais no build. O token vem do secret do repositório,
      # nunca é embarcado no site. Se falhar (ex.: cota), mantém o snapshot
      # já versionado para o build não quebrar.
      - name: Atualizar snapshot da Anatel
        id: fetch
        continue-on-error: true
        env:
          RMF_TOKEN: ${{ secrets.RMF_TOKEN }}
        run: npm run fetch

      # Versiona o snapshot/novidades para que o diff do próximo dia tenha
      # o "ontem" como base. [skip ci] evita disparar outro workflow.
      - name: Persistir dados atualizados
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dados-pelotas.json public/novidades.json
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "chore(dados): atualiza snapshot e novidades [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
