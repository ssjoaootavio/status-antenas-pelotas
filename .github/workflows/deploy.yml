name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Atualiza o snapshot da Anatel uma vez por dia (09:30 UTC ~ 06:30 BRT).
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Busca os dados reais no build. O token vem do secret do repositório,
      # nunca é embarcado no site. Se falhar (ex.: cota), mantém o snapshot
      # já versionado para o build não quebrar.
      - name: Atualizar snapshot da Anatel
        continue-on-error: true
        env:
          RMF_TOKEN: ${{ secrets.RMF_TOKEN }}
        run: npm run fetch

      - name: Build
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
